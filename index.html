<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Control de Procesos — Bellota</title>
<style>
  :root{
    --red: #E2001A;
    --red-dark: #b50014;
    --bg: #f3f4f6;
    --panel: #ffffff;
    --border: #e3e5e9;
    --text: #1c1f24;
    --text-dim: #6b7280;
    --radius: 12px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }

  header{ background:var(--red); color:#fff; padding:16px 24px; }
  .header-top{ display:flex; align-items:center; gap:16px; }
  .header-top img{ height:34px; width:auto; display:block; }
  .header-top .titulo{ font-weight:800; font-size:1.15rem; letter-spacing:.4px; }
  .header-top .divisor{ width:1px; height:34px; background:rgba(255,255,255,.35); }
  .header-top .titles h1{ margin:0; font-size:1.05rem; font-weight:700; color:#fff; }
  .header-top .titles .sub{ font-size:.78rem; opacity:.85; }

  main{ max-width:1100px; margin:0 auto; padding:28px 24px 60px 24px; }

  .section-title{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .section-title .icon{ color:var(--red); font-size:1.3rem; }
  .section-title h1{ margin:0; font-size:1.15rem; letter-spacing:.5px; color:var(--text); }
  .section-title .count{ margin-left:auto; font-size:.8rem; color:var(--text-dim); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:18px; }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; text-decoration:none; color:var(--text); display:block;
    transition:box-shadow .15s, transform .1s;
  }
  .card:hover{ box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-2px); }
  .card .icon-box{
    width:52px; height:52px; border-radius:10px; background:#fdeceb;
    display:flex; align-items:center; justify-content:center; font-size:1.5rem; margin-bottom:16px;
  }
  .card h3{ margin:0 0 6px 0; font-size:1rem; }
  .card .desc{ font-size:.8rem; color:var(--text-dim); margin-bottom:16px; line-height:1.4; min-height:34px; }
  .card .abrir{ font-size:.78rem; font-weight:700; color:var(--red); display:flex; align-items:center; gap:5px; }

  .card.proximo{ opacity:.55; cursor:default; }
  .card.proximo:hover{ box-shadow:none; transform:none; }
  .card.proximo .abrir{ color:var(--text-dim); }
</style>
</head>

</header>

<main>
  <div class="section-title">
    <span class="icon">&#8962;</span>
    <h1>PRINCIPALES</h1>
    <span class="count" id="contador"></span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<script>
/* ==========================================================================
   Agrega aquí cada nuevo proceso a medida que lo vayamos construyendo.
   "ruta": carpeta relativa donde vive ese proyecto dentro del repositorio.
   "proximamente": true muestra la tarjeta atenuada y sin enlace activo.
   ========================================================================== */
const PROCESOS = [
  {
    nombre: "Control de Químicos",
    descripcion: "Registro de inspección de concentraciones por turno y dashboard de cumplimiento.",
    icono: "&#129514;",
    ruta: "quimicos/"
  },
  {
    nombre: "Control de Desperdicio",
    descripcion: "Registro de piezas no conformes por línea, proceso y defecto, con dashboard por turno.",
    icono: "&#9851;",
    ruta: "desperdicio/"
  },
  {
    nombre: "Listas de Chequeo",
    descripcion: "Inspección de recepción de comercializados, consulta por orden de compra y PDF de liberación.",
    icono: "&#9989;",
    ruta: "listas/"
  },
  {
    nombre: "Control de Proceso",
    descripcion: "Control de variables por línea y proceso: limas, machetes, cuchillas y palas. Tendencia, tablero y control de diligenciamiento.",
    icono: "&#128202;",
    ruta: "proceso/"
  }
];

const grid = document.getElementById("grid");
grid.innerHTML = PROCESOS.map(p => {
  const tag = p.proximamente ? "div" : "a";
  const href = p.proximamente ? "" : `href="${p.ruta}"`;
  return `
    <${tag} ${href} class="card${p.proximamente ? " proximo" : ""}">
      <div class="icon-box">${p.icono}</div>
      <h3>${p.nombre}</h3>
      <div class="desc">${p.descripcion}</div>
      <div class="abrir">${p.proximamente ? "PRÓXIMAMENTE" : "↗ ABRIR"}</div>
    </${tag}>`;
}).join("");
document.getElementById("contador").textContent =
  `${PROCESOS.length} ${PROCESOS.length===1 ? "aplicación" : "aplicaciones"}`;
</script>

</body>
